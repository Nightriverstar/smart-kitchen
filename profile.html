<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偏好分析</title>
<script src="mqtt.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','Segoe UI',sans-serif;min-height:100vh;display:flex;background:#FEF9E8;color:#3d2e1a;overflow-x:hidden}
.sidebar{position:fixed;top:0;left:0;width:260px;height:100vh;background:linear-gradient(180deg,#FFF9E6 0%,#FEF3D6 100%);border-right:1px solid rgba(255,193,7,0.2);display:flex;flex-direction:column;z-index:100;transition:transform 0.3s ease;box-shadow:2px 0 20px rgba(255,193,7,0.08)}
.sidebar-brand{padding:28px 20px 20px;text-align:center;border-bottom:1px solid rgba(255,193,7,0.15)}
.sidebar-brand .logo{font-size:36px;display:block;margin-bottom:6px}
.sidebar-brand h2{font-size:18px;color:#B8860B;font-weight:700;letter-spacing:2px}
.sidebar-brand p{font-size:11px;color:#C4A35A;margin-top:4px;letter-spacing:1px}
.sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.sidebar-nav a{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;text-decoration:none;color:#6B5B3E;font-size:15px;font-weight:500;transition:all 0.25s ease;position:relative}
.sidebar-nav a:hover{background:rgba(255,193,7,0.15);color:#B8860B;transform:translateX(4px)}
.sidebar-nav a.active{background:linear-gradient(135deg,rgba(255,193,7,0.2),rgba(255,179,0,0.1));color:#8B6914;font-weight:600;box-shadow:0 2px 8px rgba(255,193,7,0.12)}
.sidebar-nav a.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:24px;background:#FFC107;border-radius:0 3px 3px 0}
.sidebar-nav .nav-icon{font-size:20px;width:28px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,193,7,0.15);text-align:center;font-size:11px;color:#C4A35A}
.main-content{margin-left:260px;flex:1;min-height:100vh;padding:32px 40px;animation:fadeSlideIn 0.5s ease}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px}
.page-header h1{font-size:clamp(20px,4vw,28px);color:#8B6914;display:flex;align-items:center;gap:10px}
.date-badge{padding:8px 18px;background:rgba(255,193,7,0.12);color:#B8860B;border-radius:25px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.record-card{background:#FFFFFF;border:1px solid rgba(255,193,7,0.12);border-radius:16px;padding:22px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(255,193,7,0.06)}
.record-card .section-title{font-size:16px;font-weight:600;color:#8B6914;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.record-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.record-form .form-group{flex:1;min-width:140px}
.record-form .form-group label{display:block;margin-bottom:5px;font-size:12px;color:#B8860B;font-weight:500}
.record-form .form-group select,.record-form .form-group input{width:100%;padding:10px 14px;border:1px solid rgba(255,193,7,0.2);border-radius:10px;background:#FFFDF5;color:#3d2e1a;font-size:14px;outline:none;transition:all 0.3s ease}
.record-form .form-group select:focus,.record-form .form-group input:focus{border-color:#FFC107;box-shadow:0 0 0 3px rgba(255,193,7,0.12)}
.record-form .form-group select{appearance:none;cursor:pointer}
.record-btn{padding:10px 28px;background:linear-gradient(135deg,#FFC107,#FFB300);border:none;color:#5C4A2A;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:all 0.3s ease;box-shadow:0 4px 12px rgba(255,193,7,0.3);white-space:nowrap;height:40px}
.record-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,193,7,0.4)}
.record-btn:disabled{background:#E8E0D0;cursor:not-allowed;box-shadow:none;transform:none}
.record-success{color:#388E3C;font-size:13px;margin-top:8px;display:none;align-items:center;gap:6px}
.today-summary{background:linear-gradient(135deg,#FFF9E6,#FFF3D6);border:1px solid rgba(255,193,7,0.15);border-radius:14px;padding:18px 22px;margin-bottom:28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(255,193,7,0.06)}
.today-summary .summary-item{text-align:center;flex:1;min-width:100px}
.today-summary .summary-item .num{font-size:28px;font-weight:700;color:#8B6914;display:block}
.today-summary .summary-item .label{font-size:12px;color:#C4A35A}
.today-summary .summary-divider{width:1px;height:40px;background:rgba(255,193,7,0.2)}
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.today-stat-card{background:#FFFFFF;border:1px solid rgba(255,193,7,0.12);border-radius:14px;padding:18px 20px;box-shadow:0 2px 12px rgba(255,193,7,0.06);transition:all 0.3s ease}
.today-stat-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(255,193,7,0.12)}
.today-stat-card .stat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.today-stat-card .stat-name{font-size:15px;font-weight:600;color:#5C4A2A}
.today-stat-card .stat-count{font-size:11px;color:#C4A35A;background:rgba(255,193,7,0.08);padding:2px 10px;border-radius:10px}
.today-stat-card .stat-amount{font-size:24px;font-weight:700;color:#8B6914}
.today-stat-card .stat-amount span{font-size:13px;font-weight:400;color:#C4A35A;margin-left:4px}
.today-stat-card .stat-bar{width:100%;height:5px;background:rgba(255,193,7,0.08);border-radius:3px;margin-top:8px;overflow:hidden}
.today-stat-card .stat-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FFC107,#FFB300);transition:width 0.8s ease}
.today-empty{padding:30px;text-align:center;color:#C4A35A;background:#FFFFFF;border:1px dashed rgba(255,193,7,0.2);border-radius:14px;margin-bottom:28px}
.data-section{background:#FFFFFF;border:1px solid rgba(255,193,7,0.12);border-radius:16px;padding:22px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(255,193,7,0.06)}
.data-section .section-title{font-size:16px;font-weight:600;color:#8B6914;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.history-table{width:100%;border-collapse:collapse}
.history-table th,.history-table td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,193,7,0.08);font-size:13px}
.history-table th{background:rgba(255,193,7,0.06);font-weight:600;color:#B8860B;letter-spacing:1px}
.history-table td{color:#5C4A2A}
.history-table tr:hover td{background:rgba(255,193,7,0.04)}
.history-empty{text-align:center;padding:30px;color:#C4A35A}
.pref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pref-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#FFFDF5;border:1px solid rgba(255,193,7,0.08);border-radius:12px;transition:all 0.3s ease}
.pref-item:hover{background:rgba(255,193,7,0.06);border-color:rgba(255,193,7,0.2)}
.pref-rank{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#FFC107,#FFB300);color:#5C4A2A;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pref-info{flex:1}
.pref-name{font-size:14px;font-weight:600;color:#5C4A2A}
.pref-amount{font-size:12px;color:#C4A35A;margin-top:2px}
.pref-bar{width:80px;height:5px;background:rgba(255,193,7,0.08);border-radius:3px;overflow:hidden;flex-shrink:0}
.pref-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FFC107,#FFB300);transition:width 0.8s ease}
.pref-empty{padding:30px;text-align:center;color:#C4A35A}
.chart-card{background:#FFFFFF;border:1px solid rgba(255,193,7,0.12);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 2px 12px rgba(255,193,7,0.06)}
.chart-card .chart-title{font-size:15px;font-weight:600;color:#8B6914;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding:10px 0;border-bottom:1px solid rgba(255,193,7,0.1);overflow-x:auto}
.bar-item{display:flex;flex-direction:column;align-items:center;min-width:36px}
.bar-fill{width:24px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#FFC107,#FFB300);transition:height 0.6s ease;min-height:2px}
.bar-label{font-size:10px;color:#C4A35A;margin-top:4px;white-space:nowrap}
.period-select{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.period-btn{padding:8px 18px;border:1px solid rgba(255,193,7,0.2);border-radius:20px;background:#FFFFFF;color:#6B5B3E;font-size:13px;cursor:pointer;transition:all 0.3s ease;font-weight:500}
.period-btn:hover{border-color:#FFC107;background:rgba(255,193,7,0.06)}
.period-btn.active{background:linear-gradient(135deg,#FFC107,#FFB300);color:#5C4A2A;border-color:transparent;box-shadow:0 2px 8px rgba(255,193,7,0.2)}
.hamburger{display:none;position:fixed;top:16px;left:16px;z-index:200;width:44px;height:44px;border:none;background:#FFF9E6;border-radius:12px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.08);align-items:center;justify-content:center;flex-direction:column;gap:5px;transition:all 0.3s ease}
.hamburger span{display:block;width:22px;height:2.5px;background:#B8860B;border-radius:2px;transition:all 0.3s ease}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:99}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main-content{margin-left:0;padding:24px 16px;padding-top:76px}
.hamburger{display:flex}
.overlay{display:block}
.overlay.hidden{display:none}
.page-header{flex-direction:column;align-items:stretch;text-align:center}
.record-form{flex-direction:column}
.record-form .form-group{min-width:100%}
.today-grid{grid-template-columns:1fr 1fr}
.today-summary{flex-direction:column;gap:12px}
.today-summary .summary-divider{width:80%;height:1px}
.pref-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="overlay hidden" id="overlay" onclick="toggleSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand"><span class="logo">🍳</span><h2>智能厨房</h2><p>Smart Kitchen System</p></div>
<nav class="sidebar-nav">
<a href="index.html"><span class="nav-icon">🏠</span>首页</a>
<a href="monitor.html"><span class="nav-icon">📊</span>实时监控</a>
<a href="manage.html"><span class="nav-icon">🧂</span>调料管理</a>
<a href="profile.html" class="active"><span class="nav-icon">📈</span>偏好分析</a>
<a href="ai.html"><span class="nav-icon">🤖</span>AI智能助手</a>
</nav>
<div class="sidebar-footer">v1.0.0 | ESP32-S3</div>
</aside>
<div class="main-content">
<div id="apiNotice" style="display:none;background:rgba(255,193,7,0.10);border:1px solid rgba(255,193,7,0.25);color:#8B6914;border-radius:10px;padding:10px 16px;margin-bottom:16px;font-size:13px">ℹ️ 用量统计需要连接 ESP32 局域网才可用</div>
<div class="page-header">
<h1>📈 偏好分析</h1>
<div class="date-badge">📅 <span id="todayDate">--</span></div>
</div>
<div class="record-card">
<div class="section-title">✏️ 记录调料用量</div>
<form class="record-form" id="recordForm" onsubmit="return false;">
<div class="form-group">
<label>选择调料</label>
<select id="recordBottle"><option value="">加载中...</option></select>
</div>
<div class="form-group">
<label>用量 (g)</label>
<input type="number" id="recordAmount" placeholder="如: 10" min="0.1" step="0.1" required>
</div>
<div class="form-group">
<label>备注（可选）</label>
<input type="text" id="recordNote" placeholder="如: 炒菜用">
</div>
<button class="record-btn" id="recordBtn" onclick="recordUsage()">✅ 记录</button>
</form>
<div class="record-success" id="recordSuccess">✅ 记录成功！</div>
</div>
<div class="today-summary" id="todaySummary">
<div class="summary-item"><span class="num" id="todayTotal">0</span><span class="label">今日总用量 (g)</span></div>
<div class="summary-divider"></div>
<div class="summary-item"><span class="num" id="todayCount">0</span><span class="label">使用次数</span></div>
<div class="summary-divider"></div>
<div class="summary-item"><span class="num" id="todayVariety">0</span><span class="label">使用种类</span></div>
</div>
<div class="today-grid" id="todayGrid"></div>
<div class="chart-card">
<div class="chart-title">📊 每日用量趋势 <span class="chart-period" id="trendPeriod">近7天</span></div>
<div class="period-select">
<button class="period-btn active" data-days="7" onclick="changePeriod(7)">近7天</button>
<button class="period-btn" data-days="14" onclick="changePeriod(14)">近14天</button>
<button class="period-btn" data-days="30" onclick="changePeriod(30)">近30天</button>
<button class="period-btn" data-days="90" onclick="changePeriod(90)">近90天</button>
</div>
<div class="bar-chart" id="trendChart"><div class="history-empty" id="trendEmpty">暂无数据</div></div>
</div>
<div class="chart-card">
<div class="chart-title">🧂 调料用量排行</div>
<div id="rankList"><div class="history-empty">暂无数据</div></div>
</div>
<div class="data-section">
<div class="section-title">🏆 用户偏好汇总</div>
<div class="pref-grid" id="prefGrid"><div class="pref-empty">暂无用量数据，开始记录吧！</div></div>
</div>
<div class="data-section">
<div class="section-title">📋 最近用量记录</div>
<div id="recentRecords"><div class="history-empty">暂无记录</div></div>
</div>
</div>
<script>
var API_BASE='';
var currentDays=7;
// ===== MQTT 配置（仅用于"调料列表"下拉框） =====
const MQTT_WS_URL='wss://broker.emqx.io:8084/mqtt';
const MQTT_TOPIC_BOTTLES='lwx_kitchen_9f3a/bottles';
const MQTT_TOPIC_CONTROL='lwx_kitchen_9f3a/control';
let mqttClient=null;
let mqttBottlesReceived=false;

function showApiNotice(){ var el=document.getElementById('apiNotice'); if(el) el.style.display='block'; }
function hideApiNotice(){ var el=document.getElementById('apiNotice'); if(el) el.style.display='none'; }

document.addEventListener('DOMContentLoaded',function(){
  var n=new Date();var o={year:'numeric',month:'long',day:'numeric',weekday:'long'};
  document.getElementById('todayDate').textContent=n.toLocaleDateString('zh-CN',o);
  loadBottles();loadTodayData();loadHistory(7);loadSummary();loadRecentRecords();
});

// 调料下拉框数据：优先 MQTT，未连接时局域网 fetch 兜底
function fillBottleSelect(b){
  var sel=document.getElementById('recordBottle');
  if(!sel) return;
  sel.innerHTML='<option value="">-- 请选择 --</option>'+b.map(function(x){return '<option value="'+x.id+'" data-name="'+x.name+'">'+x.name+' ('+x.currentWeight+'g/'+x.maxWeight+'g)</option>';}).join('');
  hideApiNotice();
}
async function loadBottles(){
  if(mqttClient){
    mqttClient.publish(MQTT_TOPIC_CONTROL, JSON.stringify({action:'get_bottles'}));
    setTimeout(function(){
      if(!mqttBottlesReceived){
        var sel=document.getElementById('recordBottle');
        if(sel && sel.querySelectorAll('option').length<=1){ sel.innerHTML='<option value="">等待设备数据…</option>'; }
      }
    },5000);
    return;
  }
  try{
    var r=await fetch(API_BASE+'/api/bottles');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var b=await r.json();
    fillBottleSelect(b);
  }catch(e){
    document.getElementById('recordBottle').innerHTML='<option value="">数据暂时不可用</option>';
  }
}

async function recordUsage(){
  var sel=document.getElementById('recordBottle');
  var id=parseInt(sel.value);
  var nm=sel.options[sel.selectedIndex]?.getAttribute('data-name')||'';
  var amt=parseFloat(document.getElementById('recordAmount').value);
  var nt=document.getElementById('recordNote').value.trim();
  if(!id||isNaN(amt)||amt<=0){alert('请选择调料并输入有效用量');return;}
  var btn=document.getElementById('recordBtn');
  btn.disabled=true;btn.textContent='⏳ 记录中...';
  try{
    var r=await fetch(API_BASE+'/api/usage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bottleId:id,bottleName:nm,amount:amt,note:nt})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    if(d.success){
      var s=document.getElementById('recordSuccess');s.style.display='flex';setTimeout(function(){s.style.display='none';},3000);
      document.getElementById('recordAmount').value='';document.getElementById('recordNote').value='';
      loadTodayData();loadHistory(currentDays);loadSummary();loadRecentRecords();loadBottles();
    }else{ alert('记录失败: '+(d.error||'未知错误')); }
  }catch(e){
    showApiNotice();
  }finally{
    btn.disabled=false;btn.textContent='✅ 记录';
  }
}

async function loadTodayData(){
  try{
    var r=await fetch(API_BASE+'/api/usage/today');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    if(!d.success) throw new Error(d.error||'bad response');
    document.getElementById('todayTotal').textContent=d.totalAmount;
    document.getElementById('todayCount').textContent=d.totalRecords;
    document.getElementById('todayVariety').textContent=d.items.length;
    var g=document.getElementById('todayGrid');
    if(d.items.length===0){ g.innerHTML='<div class="today-empty">📭 今日还没有使用记录</div>'; return; }
    var mA=Math.max.apply(null,d.items.map(function(i){return i.totalAmount;}),1);
    g.innerHTML=d.items.map(function(i){var p=Math.round((i.totalAmount/mA)*100);return '<div class="today-stat-card"><div class="stat-header"><span class="stat-name">🧂 '+i.bottleName+'</span><span class="stat-count">'+i.count+'次</span></div><div class="stat-amount">'+i.totalAmount+'<span>g</span></div><div class="stat-bar"><div class="stat-fill" style="width:'+p+'%"></div></div></div>';}).join('');
  }catch(e){
    document.getElementById('todayGrid').innerHTML='<div class="today-empty">数据暂时不可用</div>';
    showApiNotice();
  }
}

function changePeriod(d){currentDays=d;document.querySelectorAll('.period-btn').forEach(function(b){b.classList.remove('active');});var b=document.querySelector('.period-btn[data-days="'+d+'"]');if(b)b.classList.add('active');loadHistory(d);}

async function loadHistory(d){
  try{
    var r=await fetch(API_BASE+'/api/usage/history?days='+d);
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d2=await r.json();
    if(!d2.success)throw new Error(d2.error||'bad response');
    document.getElementById('trendPeriod').textContent='近'+d2.days+'天';
    renderTrend(d2.dailyTotals);renderRank(d2.bottleSummary);
  }catch(e){
    document.getElementById('trendChart').innerHTML='<div class="history-empty">数据暂时不可用</div>';
    document.getElementById('rankList').innerHTML='<div class="history-empty">数据暂时不可用</div>';
    showApiNotice();
  }
}

function renderTrend(dt){var el=document.getElementById('trendChart');var has=dt.some(function(x){return x.totalAmount>0;});if(!has){el.innerHTML='<div class="history-empty">暂无数据</div>';return;}var mV=Math.max.apply(null,dt.map(function(x){return x.totalAmount;}),1);el.innerHTML=dt.map(function(d){var h=Math.max(2,Math.round((d.totalAmount/mV)*120));return '<div class="bar-item"><div class="bar-fill" style="height:'+h+'px" title="'+d.date+': '+d.totalAmount+'g"></div><div class="bar-label">'+d.date.substring(5)+'</div></div>';}).join('');}

function renderRank(bs){var el=document.getElementById('rankList');if(!bs||bs.length===0){el.innerHTML='<div class="history-empty">暂无数据</div>';return;}bs.sort(function(a,b){return b.totalAmount-a.totalAmount;});var mA=bs[0].totalAmount||1;var md=['🥇','🥈','🥉'];el.innerHTML='<div style="display:flex;flex-direction:column;gap:8px">'+bs.map(function(item,i){var rk=md[i]||(i+1)+'.';var p=Math.round((item.totalAmount/mA)*100);return '<div style="display:flex;align-items:center;gap:12px;padding:8px 12px;background:#FFFDF5;border-radius:10px;border:1px solid rgba(255,193,7,0.08)"><span style="font-size:18px;width:30px;text-align:center">'+rk+'</span><span style="flex:1;font-weight:600;color:#5C4A2A;font-size:14px">'+item.bottleName+'</span><span style="color:#C4A35A;font-size:12px">'+item.totalAmount+'g</span><div style="width:80px;height:6px;background:rgba(255,193,7,0.08);border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:linear-gradient(90deg,#FFC107,#FFB300);width:'+p+'%"></div></div></div>';}).join('')+'</div>';}

async function loadSummary(){
  try{
    var r=await fetch(API_BASE+'/api/usage/summary');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    var g=document.getElementById('prefGrid');
    if(!d.success||!d.hasData){g.innerHTML='<div class="pref-empty">暂无用量数据，开始记录吧！</div>';return;}
    var mA=d.topUsed.length>0?d.topUsed[0].totalAmount:1;var md=['🥇','🥈','🥉','4️⃣','5️⃣'];
    g.innerHTML=d.topUsed.map(function(item,i){var p=Math.round((item.totalAmount/mA)*100);return '<div class="pref-item"><div class="pref-rank">'+(md[i]||(i+1))+'</div><div class="pref-info"><div class="pref-name">'+item.bottleName+'</div><div class="pref-amount">总计 '+item.totalAmount+'g · 使用 '+item.count+' 次</div></div><div class="pref-bar"><div class="pref-fill" style="width:'+p+'%"></div></div></div>';}).join('');
  }catch(e){
    document.getElementById('prefGrid').innerHTML='<div class="pref-empty">数据暂时不可用</div>';
    showApiNotice();
  }
}

async function loadRecentRecords(){
  try{
    var r=await fetch(API_BASE+'/api/usage/history?days=7');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    var el=document.getElementById('recentRecords');
    if(!d.success||d.dailyTotals.every(function(x){return x.count===0;})){el.innerHTML='<div class="history-empty">暂无记录</div>';return;}
    var recs=[];for(var i=0;i<d.dailyTotals.length;i++){if(d.dailyTotals[i].count>0){recs.push({date:d.dailyTotals[i].date,total:d.dailyTotals[i].totalAmount,count:d.dailyTotals[i].count});}}
    if(recs.length===0){el.innerHTML='<div class="history-empty">暂无记录</div>';return;}
    el.innerHTML='<table class="history-table"><thead><tr><th>日期</th><th>总用量(g)</th><th>次数</th></tr></thead><tbody>'+recs.map(function(r){return '<tr><td>'+r.date+'</td><td>'+r.total+'</td><td>'+r.count+'</td></tr>';}).join('')+'</tbody></table>';
  }catch(e){
    document.getElementById('recentRecords').innerHTML='<div class="history-empty">数据暂时不可用</div>';
    showApiNotice();
  }
}

// ===== MQTT 连接（仅订阅调料列表） =====
function initProfileMQTT(){
  if (typeof mqtt === 'undefined') { return; }
  mqttClient=mqtt.connect(MQTT_WS_URL,{clientId:'webp_'+Math.random().toString(16).slice(2,10)});
  mqttClient.on('connect',function(){
    mqttClient.subscribe(MQTT_TOPIC_BOTTLES);
    mqttClient.publish(MQTT_TOPIC_CONTROL, JSON.stringify({action:'get_bottles'}));
  });
  mqttClient.on('message',function(topic,payload){
    if(topic===MQTT_TOPIC_BOTTLES){
      try{
        var b=JSON.parse(payload.toString());
        mqttBottlesReceived=true;
        fillBottleSelect(b);
      }catch(e){}
    }
  });
  mqttClient.on('error',function(){});
}
initProfileMQTT();

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('hamburger').classList.toggle('active');document.getElementById('overlay').classList.toggle('hidden')}
</script>
